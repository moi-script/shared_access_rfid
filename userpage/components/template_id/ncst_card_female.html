<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCST Student ID - Estee Bayani</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .id-card {
            width: 420px;
            height: 650px;
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top White Section (Logo) */
        .card-header {
            height: 190px;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 15px;
        }

        .logo-placeholder {
            width: 130px;
            height: auto;
        }

        /* Dark Blue Banner */
        .blue-banner {
            background-color: #112952;
            color: #ffffff;
            text-align: center;
            padding: 12px 10px;
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Yellow Body Section */
        .card-body {
            background-color: #f7ca18; /* NCST Yellow */
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 25px 15px 15px 15px;
        }

        .student-info-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 5px;
            margin-bottom: 25px;
        }

        .text-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin-top: 35px;
        }

        .info-block {
            margin-bottom: 25px;
            color: #1a1a1a;
        }

        .info-label {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .info-value-id {
            font-size: 26px;
            font-weight: 800;
        }

        .info-value-course {
            font-size: 21px;
            font-weight: 500;
        }

        /* Photo Container */
        .photo-container {
            width: 195px;
            height: 200px;
            background-color: #f5f5f5;
            border: 3px solid #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .student-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Bottom White Name Box */
        .name-box {
            background-color: #f5f5f5; /* Off-white/light gray inner box */
            border: 1px solid #a0a0a0;
            margin: 0 5px;
            padding: 12px 10px;
            text-align: center;
        }

        .student-name {
            font-size: 30px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .student-affiliation {
            font-size: 20px;
            font-weight: 400;
            color: #1a1a1a;
        }
    </style>
</head>
<body>

    <div class="id-card">
        
        <div class="card-header">
            <img src="https://via.placeholder.com/130x160?text=NCST+Logo" alt="NCST Logo" class="logo-placeholder">
        </div>

        <div class="blue-banner">
            National College of Science & Technology
        </div>

        <div class="card-body">
            
            <div class="student-info-row">
                <div class="text-info">
                    <div class="info-block">
                        <div class="info-label">Student Number</div>
                        <div class="info-value-id">1998-00002</div>
                    </div>
                    
                    <div class="info-block">
                        <div class="info-label">Course</div>
                        <div class="info-value-course">NCST Heroes</div>
                    </div>
                </div>

                <div class="photo-container">
                    <img src="https://via.placeholder.com/195x200?text=Estee+Bayani" alt="Student Portrait" class="student-photo">
                </div>
            </div>

            <div class="name-box">
                <div class="student-name">Estee Bayani</div>
                <div class="student-affiliation">NCST Nation Builders</div>
            </div>

        </div>
    </div>

</body>
</html>

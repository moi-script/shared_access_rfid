<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card</title>
    <style>
        /* Base styles and centering */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        /* Main ID Card Container */
        .id-card {
            width: 280px;
            height: 440px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #ccc;
        }

        /* Top Header Section (White) */
        .header {
            position: relative;
            height: 90px;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Green Validation Sticker */
        .sticker {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #1ed75f;
            color: black;
            font-weight: bold;
            font-size: 14px;
            padding: 5px;
            height: 65px;
            width: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        /* Dummy Logo Area */
        .logo-container {
            text-align: center;
        }
        .dummy-logo {
            width: 45px;
            height: 50px;
            background-color: #e3d23b;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            border: 2px solid #292a73;
            font-size: 10px;
            font-weight: bold;
            color: #292a73;
        }
        .logo-text {
            font-size: 8px;
            margin-top: 4px;
            color: #555;
        }

        /* Blue Divider Banner */
        .blue-banner {
            background-color: #2e3185;
            color: white;
            text-align: center;
            padding: 4px 0;
            font-size: 10px;
            font-weight: normal;
            letter-spacing: 0.5px;
        }

        /* Middle Section (Yellow) */
        .card-body {
            background-color: #e2dc12;
            flex: 1;
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            position: relative;
        }

        /* Left Side Text Info */
        .student-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            margin-top: 25px;
        }

        .label {
            font-size: 10px;
            color: #333;
            margin-bottom: 2px;
            font-weight: bold;
        }

        .value {
            font-size: 15px;
            font-weight: bold;
            color: black;
            margin-bottom: 15px;
        }

        .course-value {
            font-size: 12px;
            font-weight: normal;
        }

        /* Right Side Photo */
        .photo-container {
            width: 95px;
            height: 110px;
            background-color: white;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-top: 5px;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Bottom Footer Section (White) */
        .footer {
            background-color: white;
            height: 120px;
            text-align: center;
            padding: 15px 0 0 0;
            position: relative;
            border-top: 3px solid #e2dc12;
            display: flex;
            flex-direction: column;
        }

        .student-name {
            font-size: 16px;
            font-weight: bold;
            color: #222;
            margin: 0;
        }

        .degree-name {
            font-size: 10px;
            color: #666;
            margin-top: 5px;
        }

        /* New Separator Line */
        .signature-line {
            width: 100%;
            height: 2px;
            background-color: #e2dc12; /* Yellow line matching the theme */
            margin-top: 15px;
        }

        /* SVG Signature Container */
        .signature-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="id-card">
        
        <div class="header">
            <div class="sticker">
                26-27<br>1ST SEM
            </div>
            <div class="logo-container">
                <div class="dummy-logo">LOGO</div>
                <div class="logo-text">UNIVERSITY NAME</div>
            </div>
        </div>

        <div class="blue-banner">
            Generic University of Technology
        </div>

        <div class="card-body">
            <div class="student-info">
                <div class="label">Student Number</div>
                <div class="value">2024-98765</div>
                
                <div class="label">Course</div>
                <div class="value course-value">BSCS</div>
            </div>
            
            <div class="photo-container">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" alt="Dummy Student Photo">
            </div>
        </div>

        <div class="footer">
            <h2 class="student-name">Alex Taylor Smith</h2>
            <div class="degree-name">Bachelor of Science in Computer Science</div>
            
            <div class="signature-line"></div>
            
            <div class="signature-container">
                <svg width="120" height="40" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 20 40 C 30 10, 50 10, 40 45 S 70 20, 80 40 S 110 5, 100 35 S 130 50, 120 20 S 150 25, 160 45 C 170 55, 180 15, 190 30" fill="transparent" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

    </div>

</body>
</html>
